<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <title>Weird Dream — Roman Cassini</title>
  <meta name="description" content="Paintings and photographs by Roman Cassini.">
  <link href="assets/img/DreamLogo2.png" rel="icon">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Cardo:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">

  <!-- Minimal styles -->
  <style>
    :root { --pad: 16px; }
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: #f4f4f6;
      background: linear-gradient(160deg, #0a0a3c 0%, #1a0d4d 100%);
    }

    a { color: #e5e1ff; text-decoration: none; }
    a:hover { text-decoration: underline; }

    .header { position: sticky; top: 0; background: rgba(10,10,60,0.9); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(255,255,255,0.1); }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 var(--pad); }
    .head-row { display: flex; align-items: center; justify-content: space-between; height: 64px; }

    .logo { display:flex; align-items:center; gap:10px; }
    .logo img { height: 42px; }
    .logo h1 { font-size: 20px; font-weight: 700; margin: 0; color:#fff; }

    .social a { margin-left: 10px; font-size: 20px; color:#e5e1ff; }
    .social a:hover { color:#fff; }

    .hero { padding: 64px 0 32px; text-align: center; }
    .hero h2 { font-weight: 800; font-size: clamp(26px, 4vw, 40px); margin: 0 0 12px; color:#fff; }
    .hero p { max-width: 720px; margin: 0 auto 16px; line-height: 1.5; color:#d0cfff; }

    .btn {
      display:inline-block;
      padding: 12px 18px;
      border:1px solid #e5e1ff;
      border-radius: 8px;
      font-weight: 600;
      color:#e5e1ff;
      transition: background .2s,color .2s;
    }
    .btn:hover { background:#e5e1ff; color:#0a0a3c; }

    .gallery { padding: 24px 0 56px; }
    .masonry { column-count: 3; column-gap: 14px; }
    .card { break-inside: avoid; margin: 0 0 14px; }
    .card img { width: 100%; height: auto; display:block; border-radius: 8px; box-shadow:0 4px 10px rgba(0,0,0,0.3); }
    .caption { font-size: 14px; color:#c5c4ff; margin-top:6px; }

    .footer { border-top:1px solid rgba(255,255,255,0.1); padding: 20px 0 30px; text-align:center; font-size: 14px; color:#ccc; }
    .footer .social a { margin: 0 8px; font-size: 18px; color:#e5e1ff; }
    .footer .social a:hover { color:#fff; }

    @media (max-width: 992px){ .masonry{ column-count:2; } }
    @media (max-width: 576px){ .masonry{ column-count:1; } .head-row{ height:56px; } }
  </style>
</head>
<body>

  <header class="header">
    <div class="wrap head-row">
      <a href="/" class="logo">
        <img src="assets/img/DreamLogo2.png" alt="Weird Dream logo">
        <h1>Weird Dream</h1>
      </a>
      <div class="social">
        <a href="https://www.instagram.com/roman.cassini.art" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
        <a href="https://www.linkedin.com/in/roman-cassini-160499192" aria-label="LinkedIn"><i class="bi bi-linkedin"></i></a>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap">
        <h2>I’m <span style="text-decoration:underline">Roman Cassini</span>, a painter and photographer from West London</h2>
        <p>My work explores complexity, perspective, quality, and subjective experience.</p>
        <a class="btn"
           href="mailto:roman@weird-dream.com?subject=Commission%20enquiry%20%E2%80%94%20Weird%20Dream&body=Hi%20Roman%2C%0A%0AProject%20idea%3A%0AStyle%2Freference%3A%0ASize%3A%0ATiming%3A%0ABudget%3A%0A%0AThanks%2C%0A">
          Commissions
        </a>
      </div>
    </section>

    <section class="gallery">
      <div class="wrap">
        <div class="masonry">
          <figure class="card">
            <img src="assets/img/gallery/Maggiore.jpg" alt="Lago Maggiore at Sundown" loading="lazy">
            <figcaption class="caption">Lago Maggiore at Sundown · Acrylic on canvas board · 16 × 12″ · 2025</figcaption>
          </figure>

          <figure class="card">
            <img src="assets/img/gallery/Garda.jpg" alt="Clouds Rolling over Lake Garda" loading="lazy">
            <figcaption class="caption">Clouds Rolling over Lake Garda · Acrylic on canvas board · 16 × 12″ · 2025</figcaption>
          </figure>

          <figure class="card">
            <img src="assets/img/gallery/Tuscany.jpg" alt="Tuscan Pine at Sunset" loading="lazy">
            <figcaption class="caption">Tuscan Pine at Sunset · Acrylic on canvas board · 16 × 12″ · 2025</figcaption>
          </figure>

          <figure class="card">
            <img src="assets/img/gallery/Potential.jpg" alt="Potential" loading="lazy">
            <figcaption class="caption">Potential · Pencil and ink on paper · 24 cm × 18 cm · 2024</figcaption>
          </figure>

          <figure class="card">
            <img src="assets/img/gallery/Still%20Life.jpg" alt="Still Life" loading="lazy">
            <figcaption class="caption">Still Life · Oil on canvas board · 16″ × 12″ · 2024</figcaption>
          </figure>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap">
      <p>© <strong>Roman Cassini</strong> 2025</p>
      <div class="social">
        <a href="https://www.instagram.com/roman.cassini.art"><i class="bi bi-instagram"></i></a>
        <a href="https://www.linkedin.com/in/roman-cassini-160499192"><i class="bi bi-linkedin"></i></a>
      </div>
    </div>
  </footer>

</body>
</html>
